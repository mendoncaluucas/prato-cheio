<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prato Cheio</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; max-width: 40rem; }
    h1 { font-size: 1.3rem; }
    fieldset { border: 1px solid #ccc; border-radius: .5rem; margin-bottom: 1rem; }
    label { display: block; margin: .5rem 0 .2rem; font-size: .9rem; }
    input, button { font-size: 1rem; padding: .6rem; width: 100%; box-sizing: border-box; }
    button { margin-top: .8rem; cursor: pointer; }
    li { border: 1px solid #ddd; border-radius: .5rem; padding: .6rem; margin-bottom: .5rem; list-style: none; }
    ul { padding: 0; }
    .aviso { margin: .8rem 0 0; padding: .6rem; border-radius: .5rem; font-size: .9rem; }
    .aviso[hidden] { display: none; }
    .aviso.erro { background: #fde8e8; border: 1px solid #f5b5b5; color: #8a1c1c; }
    .aviso.ok { background: #e6f4ea; border: 1px solid #b7dfc4; color: #1b5e2a; }
    .nota { font-size: .85rem; color: #555; margin: -.4rem 0 .6rem; }
    .tabela { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-size: .85rem; }
    th, td { border: 1px solid #ddd; padding: .4rem .5rem; text-align: right; white-space: nowrap; }
    th:first-child, td:first-child { text-align: left; }
    th { background: #f4f4f4; font-weight: 600; }
    button.secundario { margin-top: .4rem; background: none; border: 1px solid #c8a3a3; color: #8a1c1c; font-size: .85rem; padding: .4rem; }
  </style>
</head>
<body>
  <h1>Prato Cheio</h1>

  <fieldset>
    <legend>Publicar doação</legend>
    <label for="tipo">Tipo de alimento</label>
    <input id="tipo" placeholder="Ex.: sopa, pão, frutas">
    <label for="quantidade">Quantidade</label>
    <input id="quantidade" placeholder="Ex.: 10 porções">
    <label for="validade">Validade / retirar até</label>
    <input id="validade" type="date">
    <button id="publicar">Publicar</button>
    <p id="aviso" class="aviso" role="status" hidden></p>
  </fieldset>

  <h2>Doações disponíveis</h2>
  <ul id="lista"></ul>

  <h2>Aguardando coleta</h2>
  <ul id="aguardando"></ul>

  <h2>Relatório semanal</h2>
  <p class="nota">Semana de publicação, começando na segunda-feira. A taxa de coleta não conta as doações retiradas.</p>
  <div class="tabela">
    <table>
      <thead>
        <tr>
          <th>Semana</th><th>Publicadas</th><th>Coletadas</th><th>Retiradas</th>
          <th>Vencidas</th><th>Em aberto</th><th>Taxa de coleta</th><th>Mediana até a coleta</th>
        </tr>
      </thead>
      <tbody id="relatorio"></tbody>
    </table>
  </div>

  <script>
    // Recarrega as listas e o relatório: cada ação muda a situação de uma doação.
    function carregar() {
      carregarDisponiveis();
      carregarAguardando();
      carregarRelatorio();
    }

    // H6b — uma linha por semana; "—" quando não há base para calcular.
    async function carregarRelatorio() {
      const res = await fetch('/api/relatorios/semanal');
      const semanas = await res.json();
      const corpo = document.getElementById('relatorio');
      corpo.innerHTML = '';
      if (!semanas.length) {
        corpo.innerHTML = '<tr><td colspan="8">Nenhuma doação publicada ainda.</td></tr>';
        return;
      }
      for (const s of semanas) {
        const [ano, mes, dia] = s.semana.split('-');
        const celulas = [
          `${dia}/${mes}/${ano}`,
          s.publicadas, s.coletadas, s.retiradas, s.vencidasSemColeta, s.emAberto,
          s.taxaColeta === null ? '—' : `${s.taxaColeta}%`,
          s.medianaHorasAteColeta === null ? '—' : `${s.medianaHorasAteColeta} h`
        ];
        const tr = document.createElement('tr');
        for (const valor of celulas) {
          const td = document.createElement('td');
          td.textContent = valor;
          tr.appendChild(td);
        }
        corpo.appendChild(tr);
      }
    }

    async function carregarAguardando() {
      const res = await fetch('/api/doacoes/aceitas');
      const doacoes = await res.json();
      const lista = document.getElementById('aguardando');
      lista.innerHTML = doacoes.length
        ? ''
        : '<li>Nenhuma doação aguardando coleta.</li>';
      for (const d of doacoes) {
        const li = document.createElement('li');
        li.textContent = `${d.tipo} — ${d.quantidade} · aceita por ${d.ong} `;
        const botao = document.createElement('button');
        botao.textContent = 'Confirmar coleta';
        botao.onclick = async () => {
          const res = await fetch(`/api/doacoes/${d.id}/coletar`, { method: 'POST' });
          const corpo = await res.json();
          if (res.ok) {
            avisar(`Coleta confirmada: ${corpo.tipo}.`, 'ok');
          } else {
            avisar(corpo.erro, 'erro');
          }
          carregar();
        };
        li.appendChild(botao);
        li.appendChild(botaoRetirar(d));
        lista.appendChild(li);
      }
    }

    async function carregarDisponiveis() {
      const res = await fetch('/api/doacoes');
      const doacoes = await res.json();
      const lista = document.getElementById('lista');
      lista.innerHTML = doacoes.length
        ? ''
        : '<li>Nenhuma doação disponível.</li>';
      for (const d of doacoes) {
        const li = document.createElement('li');
        li.textContent = `${d.tipo} — ${d.quantidade} (até ${d.validade}) `;
        const botao = document.createElement('button');
        botao.textContent = 'Aceitar';
        botao.onclick = async () => {
          const res = await fetch(`/api/doacoes/${d.id}/aceitar`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ong: 'Minha ONG' })
          });
          const corpo = await res.json();
          if (res.ok) {
            avisar(`Doação aceita: ${corpo.tipo}.`, 'ok');
          } else {
            // Recusa esperada quando outra ONG aceitou antes (CA3.2).
            avisar(corpo.erro, 'erro');
          }
          carregar();
        };
        li.appendChild(botao);
        li.appendChild(botaoRetirar(d));
        lista.appendChild(li);
      }
    }

    // A API recusa publicação e aceite com 400 e { erro }. Sem exibir essa
    // resposta, a tela fica muda e o doador não sabe por que nada aconteceu.
    // H6c — retirar uma doação denunciada como imprópria. Vale para disponíveis e para
    // aceitas ainda não coletadas; o motivo é obrigatório e a API recusa sem ele.
    function botaoRetirar(d) {
      const botao = document.createElement('button');
      botao.textContent = 'Retirar (imprópria)';
      botao.className = 'secundario';
      botao.onclick = async () => {
        const motivo = prompt(`Motivo da retirada de "${d.tipo}":`);
        if (motivo === null) return; // cancelou
        const res = await fetch(`/api/doacoes/${d.id}/retirar`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ motivo })
        });
        const corpo = await res.json();
        if (res.ok) {
          avisar(`Doação retirada: ${corpo.tipo}.`, 'ok');
        } else {
          avisar(corpo.erro, 'erro');
        }
        carregar();
      };
      return botao;
    }

    function avisar(mensagem, tipo) {
      const aviso = document.getElementById('aviso');
      aviso.textContent = mensagem;
      aviso.className = `aviso ${tipo}`;
      aviso.hidden = false;
    }

    document.getElementById('publicar').onclick = async () => {
      const campos = ['tipo', 'quantidade', 'validade'].map(
        (id) => document.getElementById(id)
      );
      const [tipo, quantidade, validade] = campos;

      const res = await fetch('/api/doacoes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          tipo: tipo.value,
          quantidade: quantidade.value,
          validade: validade.value
        })
      });
      const corpo = await res.json();

      if (res.ok) {
        avisar('Doação publicada.', 'ok');
        for (const campo of campos) campo.value = '';
      } else {
        // Campos obrigatórios (CA1.2) ou validade vencida (CA1.3).
        avisar(corpo.erro, 'erro');
      }
      carregar();
    };

    carregar();
  </script>
</body>
</html>
